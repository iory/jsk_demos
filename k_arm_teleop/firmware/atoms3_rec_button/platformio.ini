; AtomS3 (ESP32-S3FN8, 128x128 LCD under the button) as the rosbag record
; light and switch of the teleop. node_scripts/rec_button_bridge.py talks to
; it over the built-in USB serial (/dev/k_arm_rec_button).
;
;   pio run -d firmware/atoms3_rec_button -t upload --upload-port /dev/k_arm_rec_button

[env:atoms3]
platform = espressif32@6.10.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.25
build_flags =
    ; Serial is the built-in USB (USB-Serial/JTAG), not UART0
    -DARDUINO_USB_CDC_ON_BOOT=1
