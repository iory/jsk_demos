# Leader (teleop_leader_pair_description) -> follower (K_ARM_DUALARM) mapping.
#
# Calibration pose: let the leader hang under gravity -- shoulder pointing
# down, arm and wrist straight down, handle hanging down, trigger released.
# That is the K_ARM zero pose. leader_zero is the leader URDF angle of this
# pose (the leader URDF's own zero is a T-pose). feetech_leader_driver.py
# and the calibration guide in rviz read the same values.
#
# Arm joints (J0-J3): follower = sign * (leader - leader_zero).
# Wrist (J4-J6): the two wrists are built differently (leader: pitch + roll,
# K_ARM: z-y-x), so the hand rotation relative to the forearm is matched
# instead of copying angles (k_arm_teleop/kinematics.py, WristMap).
#
# Values solved from the two URDFs: every arm joint axis lines up, upper arm
# and forearm hang down, the elbow bends forward like the K_ARM, and the
# handle hangs down with the trigger facing forward. Checked numerically on
# random poses (axes and hand rotation agree to 1e-5).
leader_base:
  # leader base_link -> K_ARM base (front +x, left +y, up +z): the leader URDF
  # has its arms along -x/+x and up along +y.
  rpy: [1.5708, 0.0, -1.5708]
  xyz: [0.0, 0.9, 0.0]                 # where the leader is drawn in rviz [m]

arms:
  larm:
    enabled: true                      # teleop.launch arm:= overrides this
    controller: larm_controller        # <controller>/follow_joint_trajectory
    joints:
      - {follower: LARM_JOINT0, leader: LARM_JOINT0, sign: -1.0, leader_zero: 0.0}
      - {follower: LARM_JOINT1, leader: LARM_JOINT1, sign: -1.0, leader_zero: 1.5708}
      - {follower: LARM_JOINT2, leader: LARM_JOINT2, sign: 1.0, leader_zero: 1.5708}
      - {follower: LARM_JOINT3, leader: LARM_JOINT3, sign: 1.0, leader_zero: 0.0}
    wrist:
      leader: [LARM_JOINT4, LARM_JOINT5, LARM_JOINT6]
      follower: [LARM_JOINT4, LARM_JOINT5, LARM_JOINT6]
      # handle roll pi: trigger facing forward, like the right arm (J6 turns endlessly)
      leader_zero: [0.0, 0.0, 3.1416]
    gripper:
      enabled: true
      controller: lgripper_controller
      # false keeps the real gripper still (the virtual robot and the simulated
      # stand-in of real:=false always get the trajectory controller).
      send_to_real: true
      # Real gripper: a Dynamixel under effort control (torque), not a trajectory
      # controller. Topics checked on the robot (2026-10-06): the
      # JointGroupEffortController runs and waits for commands.
      real:
        command_topic: /gripper_left/joint_group_effort_controller/command   # std_msgs/Float64MultiArray
        servo_topic: /gripper_left/dynamixel_general_control/servo            # std_msgs/Bool, set on Start
        state_topic: /gripper_left/joint_states                               # recorded
        close_effort: -0.4               # trigger pulled all the way: closing torque
        # The Dynamixel runs in current mode: 0 only goes limp, so opening is a
        # push the other way, held until the gripper stops (open end) or
        # open_timeout, then 0 so it does not stall there.
        open_effort: 0.3
        release_fraction: 0.05           # trigger below this counts as let go
        open_min_time: 0.3               # [s] push at least this long
        open_stall_velocity: 0.05        # [rad/s] slower than this = reached the open end
        open_timeout: 2.0                # [s] stop pushing after this anyway
        # binary: open / close with hysteresis (the gripper is used open or closed);
        # proportional: closing effort follows the trigger
        mode: binary
        binary_thresholds: [0.4, 0.6]    # trigger fraction to open below / close above
      follower: left_gripper_slider_joint
      leader: LARM_GRIPPER
      leader_range: [0.0, 1.05]        # trigger released .. pulled [rad]
      follower_range: [0.0, 0.015]     # slider [m]
  rarm:
    enabled: false                     # teleop.launch arm:= overrides this
    controller: rarm_controller
    joints:
      - {follower: RARM_JOINT0, leader: RARM_JOINT0, sign: -1.0, leader_zero: 0.0}
      - {follower: RARM_JOINT1, leader: RARM_JOINT1, sign: -1.0, leader_zero: -1.5708}
      - {follower: RARM_JOINT2, leader: RARM_JOINT2, sign: -1.0, leader_zero: -1.5708}
      - {follower: RARM_JOINT3, leader: RARM_JOINT3, sign: 1.0, leader_zero: 0.0}
    wrist:
      leader: [RARM_JOINT4, RARM_JOINT5, RARM_JOINT6]
      follower: [RARM_JOINT4, RARM_JOINT5, RARM_JOINT6]
      leader_zero: [0.0, 0.0, 0.0]
    gripper:
      enabled: true
      controller: rgripper_controller
      send_to_real: true
      # Real gripper: a Dynamixel under effort control (torque), not a trajectory
      # controller. Topics checked on the robot (2026-10-06): the
      # JointGroupEffortController runs and waits for commands.
      real:
        command_topic: /gripper_right/joint_group_effort_controller/command   # std_msgs/Float64MultiArray
        servo_topic: /gripper_right/dynamixel_general_control/servo            # std_msgs/Bool, set on Start
        state_topic: /gripper_right/joint_states                               # recorded
        close_effort: -0.4               # trigger pulled all the way: closing torque
        # The Dynamixel runs in current mode: 0 only goes limp, so opening is a
        # push the other way, held until the gripper stops (open end) or
        # open_timeout, then 0 so it does not stall there.
        open_effort: 0.3
        release_fraction: 0.05           # trigger below this counts as let go
        open_min_time: 0.3               # [s] push at least this long
        open_stall_velocity: 0.05        # [rad/s] slower than this = reached the open end
        open_timeout: 2.0                # [s] stop pushing after this anyway
        # binary: open / close with hysteresis (the gripper is used open or closed);
        # proportional: closing effort follows the trigger
        mode: binary
        binary_thresholds: [0.4, 0.6]    # trigger fraction to open below / close above
      follower: right_gripper_slider_joint
      leader: RARM_GRIPPER
      leader_range: [0.0, 1.05]
      follower_range: [0.0, 0.015]

# Where the commands go. namespace is prepended to "<controller>/follow_joint_trajectory".
# action: <namespace>/<controller>/<action>. The K_ARM bringup serves
# follow_joint_trajectory_action (checked with rostopic list on the robot,
# 2026-10-06); the fake controllers serve the same name for each target.
targets:
  real: {namespace: "", joint_states: /joint_states, action: follow_joint_trajectory_action}
  virtual: {namespace: /virtual, joint_states: /virtual/joint_states, action: follow_joint_trajectory}

leader_joint_states: /teleop_leader/servo_joint_states
leader_calibrated_topic: /teleop_leader/calibrated
leader_calibrate_service: /teleop_leader/calibrate_zero
leader_move:                           # powered moves of the leader (panel buttons)
  move_service: /teleop_leader/move_to
  release_service: /teleop_leader/release
  status_topic: /teleop_leader/servo_status
  velocity: 0.4                        # [rad/s] of the joint that moves most
  min_duration: 2.0                    # [s]
  # "Leader -> init pose": follower joint angles to bring the leader to.
  # Joints not listed are 0 (the calibration pose, arm hanging) and the
  # gripper is open.
  init_pose: {}
leader_timeout: 0.3                    # [s] without leader data -> leader_lost

# Slow move from the current follower pose to the leader pose before following.
approach:
  velocity: 0.25                       # [rad/s] of the joint that moves most
  min_duration: 3.0                    # [s]
  tolerance: 0.08                      # [rad] start following below this
  max_attempts: 5

follow:
  # topic: <controller>/command (JointTrajectoryController's streaming input)
  # action: a new follow_joint_trajectory goal every cycle
  interface: topic
  # [Hz] loop rate: leader read, /k_arm_teleop_manager/command (recorded as
  # the action label) and the grippers
  rate: 50.0
  # [Hz] per target, how often a trajectory goes to the arm controllers. The
  # real robot's HrpsysJointTrajectoryBridge fell behind at 50 Hz: its servo
  # reference replayed the commands later and later (1.5 s growing to 4 s
  # within 30 s of wrist motion), so it gets fewer, longer segments.
  send_rate:
    virtual: 50.0
    real: 10.0
  # [s] per target, time_from_start of each streamed point. Keep it about one
  # send period so each segment ends as the next one arrives. The robot trails
  # the leader by about this much plus one period (measured in sim: 30 Hz /
  # 0.1 s -> 124 ms, 50 Hz / 0.04 s -> 48 ms).
  lookahead:
    virtual: 0.04
    real: 0.1
  # [rad/s] (m/s for the gripper slider) clamp on the streamed command, per
  # target, with per-joint overrides. A wrist twist turns the leader's forearm
  # roll and handle roll together, so K_ARM J4 needs much more than the arm
  # (measured on the leader: J4 p95 5 rad/s, peaks 10 rad/s; arm joints < 3).
  # The virtual robot is a simulation, so it is not held back.
  max_velocity:
    virtual: {default: 10.0}
    real:
      default: 1.5
      LARM_JOINT4: 5.0
      LARM_JOINT5: 3.0
      LARM_JOINT6: 3.0
      RARM_JOINT4: 5.0
      RARM_JOINT5: 3.0
      RARM_JOINT6: 3.0

zero_pose:
  velocity: 0.25
  min_duration: 3.0

follower_limit_margin: 0.02            # [rad] stay inside the URDF limits

recording:
  directory: ~/k_arm_bags
  prefix: k_arm_teleop
  # Rates / bandwidth measured on the robot (2026-10-06, 640x480 cameras):
  # joint_states and rarm_controller/state ~475 Hz (~60 KB/s each); each camera
  # 30 Hz, colour compressed ~1.3 MB/s, aligned depth compressedDepth 1.7 (wrist)
  # / 3.8 (head) MB/s. About 8 MB/s in all (~29 GB per hour). The uncompressed
  # image_raw would be ~20 MB/s per colour stream, so it is not recorded.
  topics:
    # robot
    - /joint_states                          # all K_ARM joints (incl. LINEAR_JOINT*)
    - /rarm_controller/state                 # desired / actual / error of the arm
    - /larm_controller/state
    - /emergency_mode
    # teleop
    - /k_arm_teleop_manager/command          # action label: joint targets sent (50 Hz)
    - /k_arm_teleop_manager/status
    - /teleop_leader/servo_joint_states      # leader readings (100 Hz)
    # grippers (Dynamixel, effort control)
    - /gripper_right/joint_states
    - /gripper_right/joint_group_effort_controller/command
    - /gripper_left/joint_states
    - /gripper_left/joint_group_effort_controller/command
    - /virtual/joint_states
    # wrist camera (right)
    - /wrist_right_camera/color/image_raw/compressed
    - /wrist_right_camera/color/camera_info
    - /wrist_right_camera/aligned_depth_to_color/image_raw/compressedDepth
    - /wrist_right_camera/aligned_depth_to_color/camera_info
    # head camera
    - /head_camera/color/image_raw/compressed
    - /head_camera/color/camera_info
    - /head_camera/aligned_depth_to_color/image_raw/compressedDepth
    - /head_camera/aligned_depth_to_color/camera_info
    - /tf
    - /tf_static
