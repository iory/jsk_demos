# USB serial devices of the teleop, by the device's serial number
# (udevadm: ID_SERIAL_SHORT). scripts/install_leader_udev.py names each one
# /dev/k_arm_<role> from this list, on any PC, and adds an adapter given with
# --role. The leader and the follower carry the same servos (ids 1-8), so
# the serial number is the only way to tell their adapters apart.
5971081343: leader
5B90150174: follower
# rec_button: the AtomS3 record button (firmware/atoms3_rec_button); its serial
# number is its MAC, quoted because of the ':'.
"F4:12:FA:6C:A3:C8": rec_button
