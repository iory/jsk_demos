arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - base_yaw_joint
    - base_pitch_joint
    - top_pitch_joint
    - wrist_x_linear_joint
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    base_yaw_joint: {trajectory: 0.1, goal: 0.1}
    base_pitch_joint: {trajectory: 0.1, goal: 0.1}
    top_pitch_joint: {trajectory: 0.1, goal: 0.1}
    wrist_x_linear_joint: {trajectory: 0.1, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: 25
  action_monitor_rate: 10

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50