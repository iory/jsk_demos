arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_roll1_joint
    - shoulder_pitch_joint
    - shoulder_roll2_joint
    - elbow_pitch_joint
    - wrist_roll_joint
    - wrist_pitch_joint
    - wrist_yaw_joint
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    shoulder_roll1_joint: {trajectory: 0.1, goal: 0.1}
    shoulder_pitch_joint: {trajectory: 0.1, goal: 0.1}
    shoulder_roll2_joint: {trajectory: 0.1, goal: 0.1}
    elbow_pitch_joint: {trajectory: 0.1, goal: 0.1}
    wrist_roll_joint: {trajectory: 0.1, goal: 0.1}
    wrist_pitch_joint: {trajectory: 0.1, goal: 0.1}
    wrist_yaw_joint: {trajectory: 0.1, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: 25
  action_monitor_rate: 10

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50